name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Executable
        run: |
          dotnet publish AgyUsageTray.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AgyUsageTray.exe
          name: Antigravity Usage Tray ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
